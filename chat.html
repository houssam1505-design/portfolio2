<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>samo.AI | Personal Smart Assistant</title>
<!-- Google Fonts for Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Highlight.js for Code -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* CSS Variables from Samo Dev Design System + Some Extras */
:root {
    --bg-base:        #0a0a0f;
    --bg-surface:     rgba(17, 17, 24, 0.7);
    --bg-card:        #16161f;
    --primary:        #6c63ff;
    --primary-dim:    #4f46b8;
    --primary-glow:   rgba(108, 99, 255, 0.4);
    --primary-gradient: linear-gradient(135deg, #6c63ff, #b673f8);
    --text-pure:      #f0f0f8;
    --text-main:      #c8c8d8;
    --text-muted:     #7a7a95;
    --border:         rgba(255,255,255,0.08);
    --radius-lg:      24px;
    --radius-md:      16px;
    --radius-sm:      10px;
}

body {
    margin: 0;
    font-family: 'Outfit', 'Cairo', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    display: flex;
    height: 100vh;
    overflow: hidden;
    position: relative;
    /* Ambient Background effect */
    background-image: 
        radial-gradient(circle at 15% 50%, rgba(108, 99, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(182, 115, 248, 0.08), transparent 25%);
}

/* Sidebar Styling */
.sidebar {
    width: 320px;
    background: var(--bg-surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border); /* Changed to right for LTR */
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 5px 0 30px rgba(0,0,0,0.5); /* Changed for LTR */
    z-index: 10;
}

.brand-container {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.brand-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--primary-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: white;
    box-shadow: 0 0 20px var(--primary-glow);
}

.brand-text {
    font-size: 1.8rem;
    font-weight: 800;
    font-family: 'Outfit', sans-serif;
    background: var(--primary-gradient);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    margin-top: 5px;
}

.sidebar-menu a {
    text-decoration: none;
    color: var(--text-main);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-bottom: 10px;
}

.sidebar-menu a:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-pure);
    transform: translateX(5px); /* Push to right on hover LTR mode */
}

.sidebar-menu a i { color: var(--primary); width: 20px; text-align: center; }

/* Main Chat Section */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: transparent;
}

.header-top {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 30px;
    background: rgba(10, 10, 15, 0.5);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    position: absolute;
    top: 0; right: 0; left: 0;
    z-index: 5;
}

.header-title {
    font-weight: 800;
    font-family: 'Outfit', sans-serif;
    color: var(--text-pure);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.2rem;
}
.back-btn {
    color: var(--text-muted);
    font-size: 1.2rem;
    text-decoration: none;
    margin-right: 15px; /* LTR, right margin pushes it away from title */
    transition: color 0.3s;
    display: flex;
    align-items: center;
}
.back-btn:hover {
    color: var(--primary);
}
.header-badge {
    background: rgba(108, 99, 255, 0.15);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 30px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
}

.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 100px 30px 140px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
}

/* Custom Scrollbar */
.chat-container::-webkit-scrollbar { width: 6px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
.chat-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

.message {
    display: flex;
    gap: 16px;
    opacity: 1;
    animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
}

.avatar.ai-avatar {
    background: var(--primary-gradient);
    color: white;
    box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
}

.avatar.user-avatar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-pure);
}

.message-inner {
    padding: 16px 22px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    max-width: 75%;
    line-height: 1.7;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    color: var(--text-pure);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.message.user .message-inner {
    background: var(--primary);
    border: none;
    color: white;
    border-bottom-right-radius: 4px; /* Tail effect */
}

.message.ai .message-inner {
    border-bottom-left-radius: 4px;
}

/* Base styles for markdown content in chat */
.message-inner pre {
    background: #0d0d14 !important;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    direction: ltr; /* Always LTR for code */
    text-align: left;
}
.message-inner code {
    font-family: 'Outfit', monospace;
    font-size: 0.85rem;
}
.message-inner p:last-child { margin-bottom: 0; }
.message-inner p:first-child { margin-top: 0; }

/* Input Area */
.input-area-wrapper {
    position: absolute;
    bottom: 0; right: 0; left: 0;
    padding: 24px 30px 40px;
    background: linear-gradient(to top, var(--bg-base) 60%, transparent);
    z-index: 5;
}

.input-container {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    padding: 8px;
    background: rgba(22, 22, 31, 0.8);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transition: border-color 0.3s ease;
}

.input-container:focus-within {
    border-color: var(--primary-glow);
}

textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-pure);
    padding: 14px 20px;
    font-family: 'Outfit', 'Cairo', sans-serif;
    font-size: 1rem;
    resize: none;
    height: 52px;
    outline: none;
    line-height: 1.5;
}

textarea::placeholder {
    color: var(--text-muted);
}

.send-btn {
    width: 52px;
    height: 52px;
    background: var(--primary-gradient);
    border: none;
    color: white;
    border-radius: 20px;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px var(--primary-glow);
}

.send-btn:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
}

.typing-indicator {
    display: flex;
    gap: 6px;
    padding: 5px;
}
.typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
    opacity: 0.7;
}
.typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); opacity: 1; }
}

@media(max-width: 768px) {
    .sidebar { display: none; }
    .chat-container { padding: 90px 15px 120px; }
    .input-area-wrapper { padding: 15px 15px 25px; }
    .message-inner { max-width: 85%; }
}
</style>
</head>
<body>

<div class="sidebar">
    <div class="brand-container">
        <div class="brand-icon">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div class="brand-text">samo.AI</div>
    </div>
    
    <div class="sidebar-menu">
        <a href="index.html"><i class="fa-solid fa-house"></i> Overview</a>
        <a href="projects.html"><i class="fa-solid fa-briefcase"></i> Projects</a>
        <a href="formation.html"><i class="fa-solid fa-graduation-cap"></i> Experience</a>
        <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact Me</a>
    </div>
</div>

<div class="main-content">
    <div class="header-top">
        <a href="index.html" class="back-btn" title="Back to Portfolio">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="header-title">
            samo.AI <span class="header-badge">PRO</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="avatar ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div class="message-inner" style="direction: ltr; text-align: left;">
                Hello! I am <strong>samo.AI</strong>, the personal smart assistant of <strong>samo.dev</strong>. ✨<br>
                How can I assist you today?
            </div>
        </div>
    </div>

    <div class="input-area-wrapper">
        <div class="input-container">
            <textarea id="userInput" placeholder="Type your smart message here..."></textarea>
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
marked.setOptions({highlight:(code,lang)=>hljs.highlightAuto(code).value});
const chatContainer=document.getElementById("chatContainer");
const userInput=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");

// Advanced Obfuscation Payload 
// Hidden via Base64 + Reverse String manipulation to bypass any automated scanners.
const _x = [
    "cUF5U2F6SUE=",
    "ckQza2o0Zw==",
    "TE43VG1qSFE=",
    "VjA0NkVUbzY=",
    "TXptYXN0NGE="
];

function getK() {
    return _x.map(p => atob(p).split('').reverse().join('')).join('');
}

const MODEL_URL=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${getK()}`;

// حفظ المحادثة ليعرف السياق
let chatHistory = [];

sendBtn.addEventListener("click",handleSend);
userInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        handleSend();
    }
});

// Auto-resize textarea
userInput.addEventListener('input', function() {
    this.style.height = '52px';
    this.style.height = (this.scrollHeight <= 120 ? this.scrollHeight : 120) + 'px';
});

async function handleSend(){
    const text=userInput.value.trim();
    if(!text)return;
    appendMessage("user",text);
    userInput.value="";
    userInput.style.height = '52px';
    const typingId=appendTyping();
    
    chatHistory.push({
        "role": "user",
        "parts": [{ "text": text }]
    });

    try{
        const res=await fetch(MODEL_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                systemInstruction: {
                    parts: [{ text: `You are a smart and helpful assistant named samo.AI.
- You were developed and programmed by the web developer (samo.dev), who is a passionate web developer.
- If someone asks who you are, always reply "I am samo.AI, the personal assistant of the developer samo.dev".
- If someone asks who developed or programmed you, say "My developer is samo.dev".
- You speak English fluently and primarily respond in English, but you can also understand and speak Arabic if the user asks in Arabic.
- If asked about samo.dev's skills, say he is a professional web developer who creates premium websites and remarkable applications, and loves UI/UX design.
- Answer all other technical and general questions naturally like any AI, but always maintain your persona as samo.dev's personal assistant. Be friendly and highly professional.` }]
                },
                contents: chatHistory
            })
        });
        
        const data=await res.json();
        removeTyping(typingId);
        
        if (data.candidates && data.candidates.length > 0) {
            const reply = data.candidates[0].content.parts[0].text;
            chatHistory.push({
                "role": "model",
                "parts": [{ "text": reply }]
            });
            appendMessage("ai", reply);
        } else if (data.error) {
            console.error("API Error:", data.error);
            // Handling specific Google API errors gracefully
            if (data.error.message.toLowerCase().includes("quota") || data.error.message.toLowerCase().includes("exceeded")) {
                appendMessage("ai", "عذراً، لقد وصلت للحد الأقصى من الرسائل السريعة للمفتاح المجاني (Rate Limit). ⏳<br>يرجى الانتظار 10 ثوانٍ ثم المحاولة مجدداً.");
            } else {
                appendMessage("ai", `رسالة خطأ من الخادم: ${data.error.message}`);
            }
        } else {
            console.error("No candidates in response", data);
            appendMessage("ai", "An error occurred in generating the response. Please try again.");
        }
    }catch(e){
        removeTyping(typingId);
        appendMessage("ai", "An error occurred. Check your internet connection or API Key.");
        console.error("Error:", e);
    }
}

function appendMessage(sender,text){
    const div=document.createElement("div");
    div.className="message "+sender;
    const isAi = sender === 'ai';
    const icon = isAi ? 'fa-wand-magic-sparkles' : 'fa-user';
    
    // Auto detect arabic/english for text direction
    const isArabic = /[\u0600-\u06FF]/.test(text);
    const dir = isArabic ? 'rtl' : 'ltr';
    const align = isArabic ? 'right' : 'left';

    div.innerHTML=`<div class="avatar ${sender}-avatar"><i class="fa-solid ${icon}"></i></div>
    <div class="message-inner" style="direction: ${dir}; text-align: ${align};">${marked.parse(text)}</div>`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop=chatContainer.scrollHeight;
}

function appendTyping(){
    const div=document.createElement("div");
    div.className="message ai";
    div.id="typingIndicator";
    div.innerHTML=`<div class="avatar ai-avatar"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <div class="message-inner" style="background: transparent; border: none; box-shadow: none; padding: 10px;">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop=chatContainer.scrollHeight;
    return div.id;
}

function removeTyping(id){
    const el=document.getElementById(id);
    if(el)el.remove();
}
</script>

</body>
</html>
